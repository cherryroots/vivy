# Vivy settings. Secrets (tokens) go in .env, not here.
# Discord IDs: turn on Developer Mode in Discord, then right-click a user or channel.

# Users who may run admin commands.
admins = []

# The server voltgpt ran in. Its movie wheel game is imported into this server.
# main_server = 122962330165313536

# The SQLite database file.
database = "vivy.db"

# voltgpt's database. If this file exists on startup, reminders and the movie wheel are
# imported once, then the file is renamed to old.db.imported.
old_database = "old.db"

[logging]
# Channel that receives warnings, errors, and start/stop notices. The bot must be a member
# of the channel (add it like a person).
# log_channel = 123456789012345678
# Lowest level posted there: "error", "warn" or "info".
log_level = "warn"

[ai]
# Which provider chats: "claude", "openai" or "gemini" (left out: "openai"). Only that
# provider's key in .env is used.
provider = "claude"
# The provider chat moves to while the main one can't answer (leave out for none; its key
# must be in .env too). Out of credit: the main one is tried again a day later. Down: an
# hour later. The first answer that works on it moves chat back. Leave it out unless you
# want both providers' keys in use.
# fallback = "openai"

# Claude settings. The key goes in .env (ANTHROPIC_API_KEY).
[ai.claude]
model = "claude-opus-5-5"
# How much it thinks before answering: "low", "medium", "high", "xhigh" or "max".
effort = "medium"
# The most tokens one round may write, thinking included.
max_tokens = 32000
# Let it run code in Anthropic's sandbox, which also lets it open attached files.
code_execution = true
# The most web searches one request may make ($0.01 each). Past it, she answers with what
# she found. 0 means no limit.
web_search_max_uses = 5
# Anthropic's skills in the sandbox, for making spreadsheets, documents, slides and PDFs.
skills = ["xlsx", "docx", "pptx", "pdf"]
# When Claude declines a request, retry it on another Claude model.
fallbacks = true
# Claude's monthly cost in USD, for the status message and the warnings in the log channel
# at 80% and 100% (estimated from list prices). 0 turns the warnings off.
monthly_budget = 100.0
# With ANTHROPIC_ADMIN_KEY in .env, use Anthropic's real bill (read hourly) instead of the
# estimate. Without the key, or when it can't be read, the estimate is used.
billed_spend = true
# Show on the status message how much input came from the prompt cache this month.
show_cache_hits = true
# Show on the status message what each job (chat, chime-ins, reflection, diary, emoji)
# cost this month, estimated.
show_job_costs = true
# Keep the system prompt and tools in the prompt cache for an hour instead of 5 minutes,
# for answers and chime-ins. Writing it costs a bit more, but it's shared by every channel,
# so an answer after a quiet half hour still reads it cheaply.
cache_prompt_for_an_hour = true
# Keep that cache from expiring: this many minutes after chat last used it, a ping reads
# it again for about a fortieth of what writing it costs. Under 60, since the cache lasts
# an hour; 0 turns it off. A ping that finds the cache already gone is logged as a warning.
keep_cache_warm_minutes = 58
# Stop pinging this many hours after the last chat; longer, the pings cost more than one
# write.
keep_cache_warm_hours = 36

# Settings per job, for work nobody waits on. Each can set `model`, `effort`, `web` (web
# search and fetch) and `code` (code execution and the skills); what's left out keeps the
# built-in default below. Chat answers ("chat") and chime-ins ("chime") always use the main
# model and every tool, so they share the prompt cache. Jobs: "chime", "emoji", "mood",
# "reflection", "diary". Web search and code need Opus or Sonnet, not Haiku.
#
# The built-in defaults:
# [ai.claude.jobs.emoji]       # describing server emoji: simple, done once per emoji
# model = "claude-haiku-5-5"
# effort = "low"
# web = false
# code = false
#
# [ai.claude.jobs.mood]        # rewriting her mood a few times a day, in her own model
# effort = "low"
# web = false
# code = false
#
# [ai.claude.jobs.reflection]  # her daily tidy-up of memory; the diary is the same
# web = true
# code = false

# OpenAI settings. The key goes in .env (OPENAI_TOKEN).
[ai.openai]
model = "gpt-6.1-sol"
# "none", "low", "medium", "high" or "xhigh".
reasoning_effort = "medium"
# How long answers are: "low", "medium" or "high".
verbosity = "low"
# The service tier of chat answers ("fast" costs twice as much). Leave out for the
# account's default. Background jobs always use the default.
# service_tier = "fast"
# OpenAI's monthly cost in USD, chat and pictures together, for the status message and the
# warnings in the log channel at 80% and 100% (estimated from list prices). 0 turns the
# warnings off. Shown whenever OPENAI_TOKEN is set.
monthly_budget = 25.0
# With OPENAI_ADMIN_KEY in .env, use OpenAI's real bill (read hourly) instead of the
# estimate. Without the key, or when it can't be read, the estimate is used.
billed_spend = true
# Show on the status message how much input came from the prompt cache this month.
show_cache_hits = true
# Show on the status message what each job (chat, drawing, ...) cost this month, estimated.
show_job_costs = true
# Settings per job work like Claude's ([ai.openai.jobs.mood] and so on), with the same
# built-in defaults, except that emoji use the main model.

# The Game Boy strategist, on the free daily data-sharing tokens (/games gameboy play).
# GPT-6 Astra unless set here; "gpt-6.1-sol" is the other free choice. Its reviews when
# she's stuck are [ai.openai.jobs.game_review] (the same model, effort "high").
[ai.openai.jobs.game_plan]
model = "gpt-6-astra"

# Gemini settings. The key goes in .env (GEMINI_API_KEY). Used when `provider` or
# `fallback` above is "gemini". Gemini watches videos people post (uploaded with its Files
# API) and YouTube links itself, with their sound, instead of a few frames.
[ai.gemini]
model = "gemini-4-argon"
# How much it thinks: "low", "medium" or "high".
thinking_level = "medium"
# Show short summaries of its thinking in the reply's status line while it works.
thought_summaries = true
# How a posted video is watched: "static" (every second at once, with the sound; best for
# short clips) or "agentic" (the model looks through it for what it needs; cheaper on long
# videos, slower on short ones). The same for YouTube links, which are often long.
video_processing = "static"
youtube_processing = "agentic"
# Gemini's monthly cost in USD, for the status message and the warnings in the log channel
# at 80% and 100% (estimated from list prices; Google has no bill API). 0 turns the warnings
# off. Gemini 4 Argon's launch price ends on 2026-12-01 and it costs twice as much after.
monthly_budget = 25.0
# Show on the status message how much input came from the cache this month.
show_cache_hits = true
# Show on the status message what each job (chat, diary, ...) cost this month, estimated.
show_job_costs = true
# Settings per job work like Claude's ([ai.gemini.jobs.mood] and so on, with `effort` as
# the thinking level), with the same built-in defaults, except that emoji use the main model.

# Every feature has a section. These keys work in all of them:
#   enabled = false                   turn the feature off
#   guilds = [id, ...]                only in these servers
#   deny_guilds = [id, ...]           never in these servers
#   channels = [id, ...]              only in these channels
#   deny_channels = [id, ...]         never in these channels

[features.chat]
# Answers @-mentions that no other feature claimed.
enabled = true
# The most rounds of tool calls in one answer, so a confused model can't loop forever.
max_tool_rounds = 8
# How far up a reply chain her history goes, in messages.
history_turns = 40
# The most check-ins she plans with one person at a time (schedule_follow_up).
follow_ups_per_person = 5
# Now and then Vivy reads the last 15 messages to learn from them for her memory. The chance
# per message (0 turns it off), and how long a channel waits before she reads it again.
chime_chance = 0.05
chime_cooldown_minutes = 30
# Of those reads, the share where she also posts a line, and the share where she reacts to
# the last message with an emoji. The rest she only reads.
chime_say_chance = 0.10
chime_react_chance = 0.40
# Other chances for some people's messages (0 to 1, like chime_chance): [user ID, chance]
# for anywhere, or [user ID, chance, channel ID] for one channel, which wins over anywhere.
# 0 means she never reads along on their messages there. The channel's cooldown still applies.
# chime_chance_per_user = [
#     [123456789012345678, 0.5],
#     [123456789012345678, 0.0, 234567890123456789],
# ]

[features.reminders]
enabled = true

[features.wheel]
# The movie wheel betting game. Admin actions use `admins` above.
# guilds = [122962330165313536]

[features.memory]
# Notes Vivy keeps between conversations, through chat's `memory` tool and /memory.
# Once a day, each server whose memory changed gets a reflection: Vivy tidies the folder
# and updates her notes about herself and her mood, which sets her Discord status.
enabled = true
# Channels or threads where Vivy posts a weekly diary entry about her week in that server.
# Several in one server (say a channel and a thread in it) get the same entry.
# diary_channels = [123456789012345678, 234567890123456789]
# How often a day Vivy checks in with her mood in each server (0 turns it off; the daily
# reflection still updates it). Each check is one short model call.
mood_checks_per_day = 5
# Where she lives, so her mood follows the time of day (sleepy late at night).
timezone = "UTC"
# A folder with one PNG per mood, named after it: happy.png, sleepy.png, ... She picks one
# with each mood, and it becomes her avatar in that server (and shows on the status
# picture). Leave out for no faces.
# faces_dir = "faces"
# How far to zoom in on the faces for her avatar (1 is the whole picture, 1.5 the middle two
# thirds), and where the middle of the crop sits, from the top (0) to the bottom (1).
face_zoom = 1.0
face_center = 0.5
# A folder with her banner for each time of day where she lives: morning.png (5 to 11),
# day.png (11 to 17), evening.png (17 to 22) and night.png. Checked every hour. Leave out
# for no banners.
# banners_dir = "banners"
# Her name in each server, followed by an emoji she picks with her mood ("Vivy ☕"). Leave
# out to keep her name as it is.
# nickname = "Vivy"

[features.voice]
# Voice messages: Vivy can answer with a Discord voice message in her own voice, made with
# ElevenLabs. The key goes in .env (ELEVENLABS_API_KEY); without it she can't send them.
enabled = true
# The ElevenLabs voice she speaks with (from Voice Design or the voice library). Required
# for voice messages: without it she can't send them.
# voice_id = "DIIk31SqVXDOEFbJGJl9"
# Other voices by name, for other features. The Hunger Games' Gamemaker speaks with
# `gamemaker` (this is the default); an empty ID turns a voice off.
# voices = { gamemaker = "DucUc05HgR5M3wbY6WkG" }
# "eleven_v4", or "eleven_v4_turbo" for faster and half the price.
model = "eleven_v4"
# 0 to 1: lower is more expressive and varied, higher is steadier.
stability = 0.5
# 0 to 1: how closely it sticks to the voice.
similarity = 0.75
# A language code like "en" to force a language. Left out, it follows the text.
# language = "en"
# The most characters a month, all voice messages together (0 for no limit). ElevenLabs
# bills per character, audio tags included. The status picture shows what's used.
monthly_characters = 50000
# The most characters in one voice message.
max_characters = 1000

[features.drawing]
# Drawing: Vivy draws pictures with OpenAI's GPT Image 2.5 through chat's `draw_picture`
# tool, whichever provider chats. Needs OPENAI_TOKEN in .env.
enabled = true
# For new pictures. "gpt-image-2.5-flare" is fast and good for everyday pictures;
# "gpt-image-2.5-sunburst" is the most capable. Both cost the same per token.
model = "gpt-image-2.5-flare"
# For changing a picture or drawing from one (the asker's pictures, or the message they
# replied to). Sunburst is the most precise at edits.
edit_model = "gpt-image-2.5-sunburst"
# "low", "medium", "high", "xhigh" or "max". Higher looks better and costs more.
quality = "medium"
# "png", "jpeg" or "webp".
format = "png"
# OpenAI's safety filter: "auto", or "low" for less strict.
moderation = "auto"
# The most pictures a month, all servers together (0 for no limit). The status picture
# shows how many were drawn and what they cost.
monthly_pictures = 100
# The most pictures a month for one person, so nobody uses up the month's pictures alone
# (0 for no limit per person).
per_user_monthly_pictures = 20

[features.tinyfish]
# Web search with TinyFish: chat's `tinyfish_search` and `tinyfish_fetch` tools, with every
# provider, next to their own web tools. TinyFish reaches sites those often can't, like
# Reddit. Needs TINYFISH_API_KEY in .env; without it she can't use them. Free up to 12,000
# searches (30 a minute) and 1,000 pages (150 a minute) a day.
enabled = true
# How many results she reads per search, 1 to 10.
max_results = 8
# Where results come from and their language, when she doesn't say. Left out, TinyFish
# uses "US" and "en", or pairs the one you set with its usual partner ("JP" -> "ja").
# location = "US"
# language = "en"
# The most characters she reads of one page; the rest is cut off.
max_page_characters = 15000

[features.snails]
# Repost detection. New messages' links and pictures are saved as they arrive; right-click a
# message → Apps → Check Snail lists earlier posts of the same link or picture.
# Older history is only read when an admin runs `/snails backfill start`.
enabled = true
# How old a message may be, in days, and still count as a snail on the leaderboard. The
# backfill and its catch-up reach old messages, and reposting is about now.
count_within_days = 7

[features.games]
# /games: the games below share this section's gate (enabled, guilds, channels...).
enabled = true

[features.games.who_said_it]
# /games whosaidit: messages from the channel's history, and everyone races to press who wrote them.
# Questions per game (when /games whosaidit doesn't say), and seconds to answer each (at least 5).
rounds = 10
answer_seconds = 20
# Seconds between an answer and the next question, to read who got it.
pause_seconds = 5
# How far back quotes come from.
lookback_days = 365
# The shortest and longest messages used, in characters.
min_length = 20
max_length = 300
# People whose messages are never used.
# exclude_users = [123456789012345678]

[features.games.hunger_games]
# /games hungergames: a battle royale between members that Vivy writes, round by round.
# The most tributes in one game (at most 24).
max_tributes = 24
# How long the Reaping stays open for the host to press Start.
lobby_minutes = 10
# Seconds people get to read a round before the next one is posted (at least 5).
auto_advance_seconds = 45
# The most places in the arena (one per tribute up to this). Past 8, a second ring of zones
# goes around the map, which is harder to read.
max_places = 8
# Whether Vivy describes each place as the Games start, from her note about what the
# server's channels are for. One short model call.
describe_areas = true
# The most who step into one Octagon (at least 2), and the most rounds the last two sides
# wander before they must meet.
most_in_octagon = 4
wander_rounds = 2
# With 🎨 Pictures on: the most events drawn up close each round, besides the map (0 to 9;
# 0 for maps only). Vivy picks the most interesting.
close_ups = 3
# How good the maps and close-ups are, and the victor's picture: "low", "medium", "high",
# "xhigh" or "max". Higher looks better and costs more (medium about 13 cents, high 44).
picture_quality = "medium"
victor_picture_quality = "high"

[features.games.gameboy]
# /games gameboy: a Game Boy (and Game Boy Color) emulator. Admins play it by hand, or let
# Vivy play by herself with /games gameboy play. The folder with the ROMs (.gb and .gbc
# files): your own copies of games you own.
roms_dir = "roms"
# The folder for save states, a folder per ROM inside it, with her skills, journal and
# checkpoints.
saves_dir = "gameboy"
# Minutes one /games gameboy play lasts, unless it says.
session_minutes = 60
# USD a day the paid models may cost while she plays (Haiku acting, and planning once the
# free tokens are used up), at list prices.
daily_usd = 1.5
# OpenAI's free data-sharing tokens a day, which the strategist plans on. It stops before a
# call could cross this. Its model is [ai.openai.jobs.game_plan]'s (GPT-6 Astra).
free_tokens = 1000000
# While she plays, the dashboard (a GIF of her play since the last update, and what she's
# doing) is updated this often, in seconds (at least 5; 0: only at the end). The log goes in
# a thread under it.
live_seconds = 5

[features.control_panel]
# Channel with the status message the bot keeps up to date. The bot must be a member of it.
# status_channel = 123456789012345678
status_interval_seconds = 60
