<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vivy plays</title>
<style>
  :root {
    --bg: #0e1113; --panel: #171b1e; --line: #2a3034; --text: #e6e9ea; --muted: #8b9599;
    --teal: #2bb3a3; --red: #f23f43; --amber: #f0b232; --green: #57d38c; --dim: #b5bac1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1680px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; background: var(--line); }
  .pill.live { background: rgba(229,72,77,.18); color: #ff8a8d; }
  .pill.thinking { background: rgba(245,184,61,.16); color: var(--amber); }
  .sub { color: var(--muted); font-size: 13px; }
  /* Three columns on a wide screen (the screen, the map, what she reads and wrote), two on
     a narrower one (the map above the rest), and one on a phone, with the map last. */
  .grid { display: grid; gap: 16px; align-items: start;
    grid-template-columns: minmax(0, 480px) minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "play map side"; }
  .play { grid-area: play; } .mapcol { grid-area: map; } .side { grid-area: side; }
  @media (max-width: 1280px) { .grid { grid-template-columns: minmax(0, 480px) minmax(0, 1fr); grid-template-areas: "play map" "play side"; } }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "play" "side" "map"; } }
  /* A long map scrolls in its own box instead of pushing everything down. */
  .mapbox { max-height: 70vh; overflow: auto; border-radius: 6px; }
  .caption { margin-top: 6px; min-height: 1.4em; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .screen { position: relative; width: 100%; aspect-ratio: 10 / 9; background: #000; border-radius: 8px; overflow: hidden; border: 3px solid var(--teal); }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; font-size: 13px; user-select: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .task { font-size: 16px; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; width: 0; background: var(--teal); transition: width .3s; }
  pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  /* The dashboard's colours: how an episode went, being stuck, health. */
  .done { color: var(--green); font-weight: 600; }
  .notdone { color: var(--amber); font-weight: 600; }
  .num { color: var(--muted); }
  .verb { color: var(--teal); }
  .out { color: var(--dim); }
  .warn { display: none; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--amber); font-size: 14px; }
  .warn span { color: var(--text); }
  .hp { display: inline-block; font-size: 15px; line-height: 1; margin: 0 4px; white-space: nowrap; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 2px 0; }
  .words { min-height: 2.6em; padding: 8px 10px; background: #f4f4ef; color: #111; border-radius: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  .words.none { background: transparent; color: var(--muted); padding: 0; font-family: inherit; }
  .facts div { padding: 2px 0; border-bottom: 1px solid var(--line); }
  .facts div:last-child { border-bottom: 0; }
  .facts b { color: var(--teal); font-weight: 600; }
  #map { display: block; image-rendering: pixelated; background: #0b0d0e; }
  .foot { color: var(--muted); font-size: 13px; }
  /* Her skills scroll in their own box, newest first. */
  .skillbox { max-height: 45vh; overflow: auto; font-size: 14px; }
  .skill { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .skill:first-child { padding-top: 0; }
  .skill:last-child { border-bottom: 0; }
  .skill b { color: var(--teal); }
  .skill .rule { padding-left: 12px; color: var(--dim); }
  .skill .small { color: var(--muted); font-size: 12px; }
  .skill code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--line); padding: 0 4px; border-radius: 4px; }
  /* "Vivy says": her latest commentary, like the dashboard's quote. */
  .said { display: none; border-left: 3px solid var(--teal); }
  .said p { margin: 0; white-space: pre-wrap; }
  .badge { position: absolute; top: 8px; right: 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; background: rgba(0,0,0,.65); color: #fff; display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Vivy plays</h1>
    <span id="status" class="pill">Connecting…</span>
    <span id="session" class="sub"></span>
  </header>
  <div class="grid">
    <section class="play">
      <div class="screen">
        <canvas id="game" width="160" height="144"></canvas>
        <canvas id="over" width="480" height="432"></canvas>
        <span id="badge" class="badge">her last look</span>
      </div>
      <div class="caption" id="caption"></div>
      <div class="toggles">
        <label><input type="checkbox" id="showSeen" checked> What code sees</label>
        <label><input type="checkbox" id="showTiles"> Tile grid</label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="card said" id="saidCard" style="margin-top:12px">
        <h2>💬 Vivy says</h2>
        <p id="said"></p>
      </div>
      <div class="card" style="margin-top:12px">
        <h2>Now</h2>
        <div class="task" id="task">—</div>
        <div class="bar"><div id="actionsBar"></div></div>
        <div class="sub" id="actionsText"></div>
        <div class="warn" id="stuck"></div>
      </div>
      <div class="card">
        <h2>Last actions</h2>
        <pre id="actions">—</pre>
      </div>
    </section>
    <section class="mapcol">
      <div class="card">
        <h2 id="mapTitle">Map</h2>
        <div class="mapbox" id="mapbox"><canvas id="map" width="300" height="200"></canvas></div>
        <div class="sub" id="mapNote"></div>
      </div>
      <div class="card">
        <h2 id="skillsTitle">Her skills</h2>
        <div class="skillbox" id="skills"><span class="sub">None yet.</span></div>
      </div>
    </section>
    <section class="side">
      <div class="card">
        <h2>On screen</h2>
        <div class="words none" id="words">No text box.</div>
      </div>
      <div class="card">
        <h2>From the game's memory</h2>
        <div class="facts" id="facts"><span class="sub">Nothing read yet.</span></div>
      </div>
      <div class="card">
        <h2>Goal</h2>
        <div id="goal">—</div>
      </div>
      <div class="card">
        <h2>Recent episodes</h2>
        <ul id="episodes"><li class="sub">None yet.</li></ul>
      </div>
      <div class="card">
        <h2>Her notes</h2>
        <ul id="notes"><li class="sub">None yet.</li></ul>
      </div>
      <div class="foot" id="foot"></div>
    </section>
  </div>
</main>
<script>
"use strict";
// What each letter of the map means, and how it's drawn over the screen and on the map.
const KINDS = {
  ".": ["floor", "rgba(43,179,163,0.16)", "#1f5f58"],
  "#": ["wall", "rgba(229,72,77,0.38)", "#5c2a2c"],
  '"': ["tall grass", "rgba(80,200,90,0.42)", "#2f7a38"],
  "D": ["door or stairs", "rgba(80,140,255,0.6)", "#4f86f7"],
  "S": ["sign", "rgba(255,205,60,0.6)", "#e0b13a"],
  ">": ["edge", "rgba(170,100,255,0.45)", "#8a5ad6"],
  "P": ["person", "rgba(255,150,40,0.6)", "#f08a24"],
  "!": ["her marker", "rgba(255,90,200,0.6)", "#e55bc0"],
  ",": ["floor she can't walk to from here", "rgba(43,179,163,0.07)", "#173c38"],
  "?": ["not seen yet", "rgba(120,120,120,0.45)", "#24292c"],
  "@": ["her", "rgba(0,0,0,0)", "#ffffff"],
};
const FRAME_MS = 1000 / 59.7275;      // every frame comes, at the game's speed
const EASY = 120;                     // frames behind (2 s) it plays at the game's speed
const MOST_BEHIND = 3600;             // frames (a minute); past this it skips ahead
const $ = (id) => document.getElementById(id);
const game = $("game").getContext("2d");
const over = $("over").getContext("2d");
let queue = [];
// What code saw and the dashboard, each waiting for the frame it belongs to.
let pending = [];
let shownMark = 0;
let idleSince = performance.now();
let seen = null;
let live = null;
let decoding = Promise.resolve(); // keeps the screens in order while they decode
let decodingNow = 0;              // screens come in but not decoded yet
// A tab in the background gets no animation frames, so nothing plays there. Rather than
// pile up screens to race through when it's looked at again (stuttering, and flicking
// between Live and Thinking whenever decoding fell behind), it keeps only the newest and
// starts from there.
let hiddenNewest = null;
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !hiddenNewest) return;
  const { mark, png } = hiddenNewest;
  hiddenNewest = null;
  decoding = decoding.then(async () => {
    queue.forEach((f) => f.picture.close?.());
    queue = [{ mark, picture: await createImageBitmap(png) }];
  }).catch(() => {});
});

$("legend").innerHTML = Object.entries(KINDS)
  .filter(([k]) => k !== "@")
  .map(([, [name, , colour]]) => `<span><i style="background:${colour}"></i>${name}</span>`)
  .join("");

function esc(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Plays the frames at the game's speed. She plays in bursts (an action takes a moment,
// then she thinks), so the queue empties between actions and the last frame stays up.
// Behind by much (a long walk comes all at once), it plays faster until it has caught up,
// rather than jumping ahead.
let lastTick = performance.now(), owed = 0;
function tick(now) {
  owed = Math.min(owed + (now - lastTick) / FRAME_MS * speed(queue.length), 16);
  lastTick = now;
  if (queue.length > MOST_BEHIND) queue.splice(0, queue.length - 60).forEach((f) => f.picture.close?.());
  let steps = Math.floor(owed);
  owed -= steps;
  let next = null;
  while (steps-- > 0 && queue.length) {
    next?.picture.close?.();
    next = queue.shift();
  }
  if (next) {
    game.drawImage(next.picture, 0, 0);
    next.picture.close?.();
    shownMark = next.mark;
    idleSince = now;
  }
  showPending();
  drawOver();
  showStatus();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// How much faster than the game it plays, `behind` frames behind: not at all up to 2 s,
// then a little more the further behind (1.5 times at 5 s, twice at 8 s), at most 4 times.
function speed(behind) {
  return Math.min(4, Math.max(1, 1 + (behind - EASY) / 360));
}

// Shows what code saw and the dashboard once the frame they belong to is up, or when
// there are no frames left to play.
function showPending() {
  while (pending.length && (pending[0].mark <= shownMark || queue.length === 0)) {
    const { kind, value } = pending.shift();
    if (kind === "seen") { seen = value; showSeen(); }
    if (kind === "live") { live = value; showLive(); }
  }
}

function settled() {
  return queue.length === 0 && decodingNow === 0 && performance.now() - idleSince > 250;
}

function drawOver() {
  over.clearRect(0, 0, 480, 432);
  const s = 3;
  if ($("showTiles").checked) {
    over.strokeStyle = "rgba(255,255,255,0.12)";
    over.lineWidth = 1;
    for (let x = 8; x < 160; x += 8) { over.beginPath(); over.moveTo(x * s + 0.5, 0); over.lineTo(x * s + 0.5, 432); over.stroke(); }
    for (let y = 8; y < 144; y += 8) { over.beginPath(); over.moveTo(0, y * s + 0.5); over.lineTo(480, y * s + 0.5); over.stroke(); }
  }
  // What code saw at her last look, while the screen still shows that moment.
  const show = $("showSeen").checked && seen && seen.grid && settled() && shownMark >= seen.mark;
  $("badge").style.display = show ? "block" : "none";
  if (!show) return;
  const g = seen.grid;
  const size = g.pixels * s;
  seen.on_screen.forEach((row, j) => {
    [...row].forEach((letter, i) => {
      const x = i * size, y = j * size;
      if (letter === "@") {
        over.strokeStyle = "#2bb3a3"; over.lineWidth = 3;
        over.strokeRect(x + 2, y + 2, size - 4, size - 4);
        return;
      }
      const kind = KINDS[letter];
      if (!kind) return;
      over.fillStyle = kind[1];
      over.fillRect(x + 1, y + 1, size - 2, size - 2);
    });
  });
}

function showStatus() {
  const status = $("status");
  if (!live || !live.playing) {
    status.className = "pill"; status.textContent = "⏸️ Not playing";
  } else if (settled()) {
    status.className = "pill thinking"; status.textContent = "🤔 Thinking";
  } else {
    status.className = "pill live"; status.textContent = "🔴 Live";
  }
}

function showSeen() {
  if (!seen) return;
  const words = $("words");
  if (seen.text) { words.className = "words"; words.textContent = seen.text; }
  else { words.className = "words none"; words.textContent = seen.can_walk ? "No text box: she can walk." : "No words read."; }
  $("facts").innerHTML = seen.facts.length
    ? seen.facts.map((f) => {
        const i = f.indexOf(": ");
        return i > 0 ? `<div><b>${esc(f.slice(0, i))}</b> ${withHealth(esc(f.slice(i + 2)))}</div>` : `<div>${esc(f)}</div>`;
      }).join("")
    : '<span class="sub">Nothing read from memory here.</span>';
  drawMap();
}

function drawMap() {
  const canvas = $("map");
  const rows = seen.map;
  $("mapTitle").textContent = seen.area ? `Map · ${seen.area}` : "Map";
  if (!rows.length) { canvas.height = 60; canvas.getContext("2d").clearRect(0, 0, canvas.width, 60); $("mapNote").textContent = "Nothing mapped here yet."; return; }
  const across = rows[0].length, down = rows.length;
  const width = Math.max(200, $("mapbox").clientWidth || 300);
  const cell = Math.max(3, Math.min(14, Math.floor(width / across)));
  canvas.width = across * cell; canvas.height = down * cell;
  const ctx = canvas.getContext("2d");
  let known = 0;
  rows.forEach((row, y) => [...row].forEach((letter, x) => {
    const kind = KINDS[letter] || KINDS["?"];
    if (letter !== "?") known++;
    ctx.fillStyle = kind[2];
    ctx.fillRect(x * cell, y * cell, cell, cell);
  }));
  // Her, and what's on screen around her.
  const me = [seen.at[0] - seen.map_from[0], seen.at[1] - seen.map_from[1]];
  if (seen.grid) {
    const g = seen.grid;
    ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1;
    ctx.strokeRect((me[0] - g.player[0]) * cell + 0.5, (me[1] - g.player[1]) * cell + 0.5, g.across * cell - 1, g.down * cell - 1);
  }
  ctx.fillStyle = "#2bb3a3";
  ctx.beginPath(); ctx.arc(me[0] * cell + cell / 2, me[1] * cell + cell / 2, Math.max(2, cell / 2), 0, 7); ctx.fill();
  $("mapNote").textContent = `${known} steps seen · she's at x ${seen.at[0]}, y ${seen.at[1]}`;
  // A map taller or wider than its box scrolls to keep her in view.
  const box = $("mapbox");
  box.scrollTop = Math.max(0, me[1] * cell - box.clientHeight / 2);
  box.scrollLeft = Math.max(0, me[0] * cell - box.clientWidth / 2);
}

// "17/21 HP" gets a bar like the dashboard mockup's: green, amber under half, red under a fifth.
function withHealth(text) {
  return text.replace(/(\d+)\/(\d+) HP/g, (all, hp, most) => {
    const part = Math.max(0, Math.min(1, Number(hp) / Math.max(1, Number(most))));
    const filled = Math.round(part * 10);
    const colour = part < 0.2 ? "var(--red)" : part < 0.5 ? "var(--amber)" : "var(--green)";
    return `<span class="hp" style="color:${colour}">${"▰".repeat(filled)}${"▱".repeat(10 - filled)}</span>${all}`;
  });
}

// "press "a": The text moved on." with the action and what happened in their own colours.
function actionLine(line) {
  const i = line.indexOf(": ");
  if (i < 0) return esc(line);
  return `<span class="verb">${esc(line.slice(0, i))}</span> <span class="out">${esc(line.slice(i + 2))}</span>`;
}

// "#13 10-20 14:36 Route 1: keep north → done, 12 actions, ..." with the number grey,
// the area bold, and how it went green (done) or amber (anything else).
function episodeLine(line) {
  const i = line.lastIndexOf(" → ");
  if (i < 0) return esc(line);
  const head = line.slice(0, i).match(/^(#\d+)( \S+ \S+)? ([^:]+):(.*)$/s);
  const before = head
    ? `<span class="num">${esc(head[1])}</span> <b>${esc(head[3])}</b>:${esc(head[4])}`
    : esc(line.slice(0, i));
  const after = line.slice(i + 3);
  let depth = 0, end = after.length;
  for (let k = 0; k < after.length; k++) {
    const c = after[k];
    if (c === "(") depth++; else if (c === ")") depth--; else if (c === "," && depth === 0) { end = k; break; }
  }
  const outcome = after.slice(0, end);
  const how = outcome.startsWith("done") ? "done" : "notdone";
  return `${before} <span class="${how}">→ ${esc(outcome)}</span>${esc(after.slice(end))}`;
}

// A skill as `Skill::written` gives it: "**name**: when", her notes, "- " rules with
// `presses`, and "-# " small lines for how it did. Only redrawn when one changed, so the
// box keeps where it was scrolled to.
let skillsShown = null;
function showSkills(written) {
  const key = written.join("\u0000");
  if (key === skillsShown) return;
  skillsShown = key;
  $("skillsTitle").textContent = written.length ? `Her skills (${written.length})` : "Her skills";
  const inline = (text) => esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const lines = (skill) => skill.split("\n").map((line) => {
    if (line.startsWith("-# ")) return `<div class="small">${inline(line.slice(3))}</div>`;
    if (line.startsWith("- ")) return `<div class="rule">${inline(line.slice(2))}</div>`;
    return `<div>${inline(line)}</div>`;
  }).join("");
  $("skills").innerHTML = written.length
    ? written.slice().reverse().map((skill) => `<div class="skill">${lines(skill)}</div>`).join("")
    : '<span class="sub">None yet.</span>';
}

function showLive() {
  const n = live.now;
  $("title").textContent = `Vivy plays ${live.game || "the Game Boy"}`;
  document.title = live.playing ? `🔴 Vivy plays ${live.game}` : `Vivy plays ${live.game || ""}`;
  const minutes = n.started ? Math.max(0, Math.floor((Date.now() / 1000 - n.started) / 60)) : 0;
  $("session").textContent = live.playing
    ? `Session ${n.session} · ${minutes} min · ${n.episode ? "episode " + n.episode : "planning the first episode"}${n.area ? " · " + n.area : ""}`
    : (n.session ? `Session ${n.session} ended` : "");
  $("task").textContent = live.playing && n.task ? n.task : "—";
  $("actionsBar").style.width = live.playing ? `${Math.min(100, n.actions / 30 * 100)}%` : "0";
  $("actionsText").textContent = live.playing && n.task
    ? `Action ${n.actions} of 30 · ${n.stuck ? `stuck ${n.stuck}` : "not stuck"}` : "";
  $("actions").innerHTML = n.last_actions.length ? n.last_actions.map(actionLine).join("\n") : "—";
  const newest = live.playing && n.last_actions.length ? n.last_actions[n.last_actions.length - 1] : "";
  $("caption").innerHTML = newest ? actionLine(newest) : "";
  const stuck = $("stuck");
  stuck.style.display = live.playing && n.stuck >= 3 ? "block" : "none";
  stuck.innerHTML = `⚠️ <b>Nothing new for ${n.stuck} episodes.</b> <span>She's asked to try a different kind of task, exploring first.</span>`;
  $("saidCard").style.display = n.said ? "block" : "none";
  $("said").textContent = n.said || "";
  $("goal").textContent = n.goal || "—";
  $("episodes").innerHTML = n.episodes.length ? n.episodes.map((e) => `<li>${episodeLine(e)}</li>`).join("") : '<li class="sub">None yet.</li>';
  $("notes").innerHTML = n.notes.length ? n.notes.map((t) => `<li>${esc(t)}</li>`).join("") : '<li class="sub">None yet.</li>';
  showSkills(n.skills_written || []);
  $("foot").textContent = `Today $${n.usd.toFixed(2)} on paid models · ${Math.round(n.free_tokens / 1000)}k free tokens · ${n.checkpoints} checkpoints · ${n.skills} skills${n.newest_skill ? " (newest: " + n.newest_skill + ")" : ""}`;
}

function connect(wait = 1000) {
  const url = new URL("live", location.href);
  url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const socket = new WebSocket(url);
  socket.binaryType = "arraybuffer";
  socket.onopen = () => { wait = 1000; };
  socket.onmessage = (event) => {
    if (typeof event.data === "string") {
      // In line with the frames still decoding, so it waits behind them.
      const { kind, value } = JSON.parse(event.data);
      decoding = decoding.then(() => pending.push({ kind, value, mark: value.mark || 0 }));
      return;
    }
    const view = new DataView(event.data);
    const mark = Number(view.getBigUint64(0, true));
    const png = new Blob([event.data.slice(8)], { type: "image/png" });
    if (document.hidden) { hiddenNewest = { mark, png }; return; }
    decodingNow++;
    // A screen that fails to decode is skipped, not left blocking the ones after it.
    decoding = decoding.then(async () => {
      try { queue.push({ mark, picture: await createImageBitmap(png) }); } finally { decodingNow--; }
    }).catch(() => {});
  };
  socket.onclose = () => {
    $("status").className = "pill"; $("status").textContent = "Reconnecting…";
    setTimeout(() => connect(Math.min(wait * 2, 15000)), wait);
  };
}
connect();
setInterval(() => { if (live) showLive(); }, 30000);
</script>
